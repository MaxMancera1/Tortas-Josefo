<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" font-family="Arial, Helvetica, sans-serif">
  <rect width="1100" height="720" fill="#ffffff"/>
  <text x="550" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2937">Figura 1. Diagrama de casos de uso - Sitio web Tortas Josefo</text>

  <!-- Actor -->
  <circle cx="90" cy="300" r="22" fill="none" stroke="#111827" stroke-width="2.5"/>
  <line x1="90" y1="322" x2="90" y2="390" stroke="#111827" stroke-width="2.5"/>
  <line x1="90" y1="345" x2="58" y2="375" stroke="#111827" stroke-width="2.5"/>
  <line x1="90" y1="345" x2="122" y2="375" stroke="#111827" stroke-width="2.5"/>
  <line x1="90" y1="390" x2="62" y2="445" stroke="#111827" stroke-width="2.5"/>
  <line x1="90" y1="390" x2="118" y2="445" stroke="#111827" stroke-width="2.5"/>
  <text x="90" y="475" text-anchor="middle" font-size="15" font-weight="700">Visitante</text>
  <text x="90" y="496" text-anchor="middle" font-size="12" fill="#4b5563">(cliente)</text>

  <!-- System boundary -->
  <rect x="200" y="80" width="820" height="580" fill="none" stroke="#111827" stroke-width="2" rx="4"/>
  <text x="610" y="108" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">Sitio web Tortas Josefo</text>

  <!-- Use cases -->
  <ellipse cx="430" cy="180" rx="155" ry="38" fill="#fef9c3" stroke="#111827" stroke-width="2"/>
  <text x="430" y="176" text-anchor="middle" font-size="13">Consultar inicio</text>
  <text x="430" y="194" text-anchor="middle" font-size="13">y carrusel</text>

  <ellipse cx="780" cy="180" rx="170" ry="38" fill="#fef9c3" stroke="#111827" stroke-width="2"/>
  <text x="780" y="176" text-anchor="middle" font-size="13">Consultar menu</text>
  <text x="780" y="194" text-anchor="middle" font-size="13">y precios</text>

  <ellipse cx="430" cy="290" rx="155" ry="38" fill="#fef9c3" stroke="#111827" stroke-width="2"/>
  <text x="430" y="286" text-anchor="middle" font-size="13">Consultar sucursal</text>
  <text x="430" y="304" text-anchor="middle" font-size="13">y mapa</text>

  <ellipse cx="780" cy="290" rx="170" ry="38" fill="#fef9c3" stroke="#111827" stroke-width="2"/>
  <text x="780" y="286" text-anchor="middle" font-size="13">Consultar nosotros,</text>
  <text x="780" y="304" text-anchor="middle" font-size="13">mision e historia</text>

  <ellipse cx="430" cy="400" rx="155" ry="38" fill="#fef9c3" stroke="#111827" stroke-width="2"/>
  <text x="430" y="396" text-anchor="middle" font-size="13">Consultar promociones,</text>
  <text x="430" y="414" text-anchor="middle" font-size="13">preguntas y galeria</text>

  <ellipse cx="780" cy="400" rx="170" ry="38" fill="#fef9c3" stroke="#111827" stroke-width="2"/>
  <text x="780" y="396" text-anchor="middle" font-size="13">Enviar pedido</text>
  <text x="780" y="414" text-anchor="middle" font-size="13">de practica</text>

  <ellipse cx="605" cy="530" rx="175" ry="38" fill="#fef9c3" stroke="#111827" stroke-width="2"/>
  <text x="605" y="526" text-anchor="middle" font-size="13">Ver pagina de gracias</text>
  <text x="605" y="544" text-anchor="middle" font-size="13">(confirmacion)</text>

  <!-- Associations -->
  <line x1="122" y1="340" x2="275" y2="180" stroke="#111827" stroke-width="1.5"/>
  <line x1="122" y1="340" x2="275" y2="290" stroke="#111827" stroke-width="1.5"/>
  <line x1="122" y1="340" x2="275" y2="400" stroke="#111827" stroke-width="1.5"/>
  <line x1="122" y1="340" x2="610" y2="180" stroke="#111827" stroke-width="1.5"/>
  <line x1="122" y1="340" x2="610" y2="290" stroke="#111827" stroke-width="1.5"/>
  <line x1="122" y1="340" x2="610" y2="400" stroke="#111827" stroke-width="1.5"/>
  <line x1="122" y1="340" x2="430" y2="530" stroke="#111827" stroke-width="1.5"/>

  <text x="550" y="700" text-anchor="middle" font-size="12" fill="#6b7280">Actor primario: Visitante. El pedido no se cobra ni se guarda en servidor.</text>
</svg>
