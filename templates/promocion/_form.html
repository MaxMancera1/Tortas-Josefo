<h1 class="text-3xl font-semibold"><?php echo $accion == 'create' ? 'Nueva promoción' : 'Editar promoción'; ?></h1>

<form enctype="multipart/form-data" class="cuadro-naranja mx-auto max-w-xl space-y-4" action="promocion.php?accion=<?php echo $accion; isset($datos['id']) ? print '&id='.$datos['id'] : print '';?>" method="post">

  <?php if (!empty($datos['error'])): ?>
  <p class="rounded border border-red-300 bg-red-100 px-3 py-2 text-red-700"><?php echo $datos['error']; ?></p>
  <?php endif; ?>

  <div>
    <p class="font-semibold">Imagen</p>
    <label for="imagen" class="mt-1 flex cursor-pointer items-center gap-4">
      <span class="block h-28 w-40 overflow-hidden rounded-lg border-2 border-dashed border-orange-300 bg-white">
        <img id="imagenPreview" alt="" class="h-full w-full object-cover" <?php if (!empty($datos['imagen'])): ?>src="../image/uploads/<?php echo htmlspecialchars($datos['imagen']); ?>"<?php endif; ?>>
      </span>
      <span class="rounded-lg bg-orange-500 px-4 py-2 font-semibold text-white shadow hover:bg-orange-600">Seleccionar imagen</span>
      <span id="nombreImagen" class="text-sm text-gray-600"><?php echo $accion === 'update' ? 'Deja vacío para conservar la actual' : 'JPG, PNG o WEBP, máx. 2 MB'; ?></span>

    <input type="file" name="imagen" id="imagen" class="sr-only" accept="image/jpeg,image/png,image/webp" <?php echo $accion === 'create' ? 'required' : ''; ?>>
  </div>

  <div>
    <label class="font-semibold" for="titulo">Título</label>
    <input class="mt-1 w-full rounded border border-gray-300 px-3 py-2" type="text" name="data[titulo]" id="titulo" required minlength="3" maxlength="100" placeholder="Ej. 3 tortas = refresco gratis"
      value="<?php isset($datos['titulo']) ? print htmlspecialchars($datos['titulo']) : print '';?>">
  </div>

  <div>
    <label class="font-semibold" for="descripcion">Descripción</label>
    <textarea class="mt-1 w-full rounded border border-gray-300 px-3 py-2" name="data[descripcion]" id="descripcion" rows="3" required minlength="10" maxlength="255" placeholder="Ej. En la compra de 3 tortas, el refresco va gratis."><?php isset($datos['descripcion']) ? print htmlspecialchars($datos['descripcion']) : print '';?></textarea>

    <div>
      <label class="font-semibold" for="precio">Precio</label>
      <input class="mt-1 w-full rounded border border-gray-300 px-3 py-2" type="number" name="data[precio]" id="precio" required min="1" max="9999" step="0.50" placeholder="Ej. 100"

    <div>
      <label class="font-semibold" for="vigencia">Vigente hasta</label>
      <input class="mt-1 w-full rounded border border-gray-300 px-3 py-2" type="date" name="data[vigencia]" id="vigencia" required
        <?php echo $accion === 'create' ? 'min="' . date('Y-m-d') . '"' : ''; ?>

<script>
document.getElementById('imagen').addEventListener('change', function () {
  var file = this.files && this.files[0];
  if (!file) return;
  document.getElementById('imagenPreview').src = URL.createObjectURL(file);
  document.getElementById('nombreImagen').textContent = file.name;
});
</script>
