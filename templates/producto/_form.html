<h1 class="text-3xl font-semibold"><?php echo $accion == 'create' ? 'Nuevo producto' : 'Editar producto'; ?></h1>

<form enctype="multipart/form-data" class="cuadro-naranja mx-auto max-w-xl space-y-4" action="producto.php?accion=<?php echo $accion; isset($datos['id']) ? print '&id='.$datos['id'] : print '';?>" method="post">

  <?php if (!empty($datos['error'])): ?>
  <p class="rounded border border-red-300 bg-red-100 px-3 py-2 text-red-700"><?php echo $datos['error']; ?></p>
  <?php endif; ?>

  <div>
    <p class="font-semibold">Foto</p>
    <label for="foto" class="mt-1 flex cursor-pointer items-center gap-4">
      <span class="block h-32 w-32 overflow-hidden rounded-full border-2 border-dashed border-orange-300 bg-white">
        <img id="fotoPreview" alt="" class="h-full w-full object-cover" <?php if (!empty($datos['foto'])): ?>src="../image/uploads/<?php echo htmlspecialchars($datos['foto']); ?>"<?php endif; ?>>
      </span>
      <span class="rounded-lg bg-orange-500 px-4 py-2 font-semibold text-white shadow hover:bg-orange-600">Seleccionar imagen</span>
      <span id="nombreImagen" class="text-sm text-gray-600"><?php echo $accion === 'update' ? 'Deja vacío para conservar la actual' : 'JPG, PNG o WEBP, máx. 2 MB'; ?></span>
    </label>
    <input type="file" name="foto" id="foto" class="sr-only" accept="image/jpeg,image/png,image/webp" <?php echo $accion === 'create' ? 'required' : ''; ?>>
  </div>

  <div>
    <label class="font-semibold" for="nombre">Nombre</label>
    <input class="mt-1 w-full rounded border border-gray-300 px-3 py-2" type="text" name="data[nombre]" id="nombre" required minlength="3" maxlength="150" placeholder="Ej. Torta cubana"
      value="<?php isset($datos['nombre']) ? print htmlspecialchars($datos['nombre']) : print '';?>">
  </div>

  <div>
    <label class="font-semibold" for="categoria">Categoría</label>
    <select class="mt-1 w-full rounded border border-gray-300 bg-white px-3 py-2" name="data[categoria]" id="categoria" required>
      <option value="">Elige una categoría</option>
      <?php foreach ($categorias as $categoria): ?>
      <option <?php echo ($datos['categoria'] ?? '') === $categoria ? 'selected' : ''; ?>><?php echo $categoria; ?></option>
      <?php endforeach; ?>
    </select>
  </div>

  <div>
    <label class="font-semibold" for="precio">Precio</label>
    <input class="mt-1 w-full rounded border border-gray-300 px-3 py-2" type="number" name="data[precio]" id="precio" required min="1" max="9999" step="0.50" placeholder="Ej. 50"
      value="<?php isset($datos['precio']) ? print htmlspecialchars($datos['precio']) : print '';?>">
  </div>

  <div class="flex gap-3">
    <input class="rounded-lg bg-green-600 px-4 py-2 font-semibold text-white shadow hover:bg-green-700" type="submit" name="enviar" value="Guardar">
    <a href="producto.php" class="rounded-lg bg-gray-200 px-4 py-2 font-semibold text-gray-800 hover:bg-gray-300">Cancelar</a>
  </div>

</form>
<script>
document.getElementById('foto').addEventListener('change', function () {
  var file = this.files && this.files[0];
  if (!file) return;
  document.getElementById('fotoPreview').src = URL.createObjectURL(file);
  document.getElementById('nombreImagen').textContent = file.name;
});
</script>
