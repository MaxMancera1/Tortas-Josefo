    <footer class="rounded-xl bg-orange-600 px-4 py-4 text-center text-sm text-white shadow-md">
      <p>Tortas Josefo · Panel de administración</p>
    </footer>
  </div>

  <dialog id="modal" class="w-full max-w-sm rounded-2xl p-0 shadow-2xl backdrop:bg-black/50 backdrop:backdrop-blur-sm">
    <div class="border-t-8 border-orange-500 bg-white px-6 pb-6 pt-8 text-center">
      <div class="mx-auto flex h-14 w-14 items-center justify-center rounded-full bg-red-100">
        <svg class="h-7 w-7 text-red-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.9 12.1A2 2 0 0116.1 21H7.9a2 2 0 01-2-1.9L5 7m5 4v6m4-6v6M9 7V4a1 1 0 011-1h4a1 1 0 011 1v3M4 7h16"/>
        </svg>
      </div>
      <h2 id="modal-titulo" class="mt-4 text-xl font-semibold text-gray-900"></h2>
      <p class="mt-2 text-gray-600">Se eliminará <span id="modal-nombre" class="font-semibold text-orange-700"></span>. Esta acción no se puede deshacer.</p>
      <div class="mt-6 flex justify-center gap-3">
        <button type="button" id="modal-cancelar" class="rounded-lg bg-gray-100 px-5 py-2 font-semibold text-gray-700 hover:bg-gray-200">Cancelar</button>
        <a id="modal-aceptar" href="#" class="rounded-lg bg-red-600 px-5 py-2 font-semibold text-white shadow hover:bg-red-700">Sí, eliminar</a>
      </div>
    </div>
  </dialog>

  <script>
    const modal = document.getElementById('modal');
    document.querySelectorAll('[data-confirm]').forEach(link => {
      link.addEventListener('click', e => {
        e.preventDefault();
        document.getElementById('modal-titulo').textContent = link.dataset.confirm;
        document.getElementById('modal-nombre').textContent = link.dataset.nombre;
        document.getElementById('modal-aceptar').href = link.href;
        modal.showModal();
      });
    });
    document.getElementById('modal-cancelar').addEventListener('click', () => modal.close());
    modal.addEventListener('click', e => { if (e.target === modal) modal.close(); });
  </script>
</body>
</html>
