    <footer class="rounded-xl bg-orange-600 px-4 py-4 text-center text-sm text-white shadow-md">
      <p>Tortas Josefo · Panel de administración</p>
    </footer>
  </div>

  <link href="https://cdn.jsdelivr.net/npm/simple-datatables@9/dist/style.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/simple-datatables@9"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script>
    document.querySelectorAll('table.tabla-datos').forEach(function (tabla) {
      new simpleDatatables.DataTable(tabla, {
        searchable: true,
        perPage: 10,
        labels: {
          placeholder: 'Buscar...',
          perPage: 'filas por página',
          noRows: 'No hay registros',
          info: 'Mostrando {start} a {end} de {rows}'
        }
      });
    });
    document.querySelectorAll('[data-confirm]').forEach(function (link) {
      link.addEventListener('click', function (e) {
        e.preventDefault();
        Swal.fire({
          title: link.dataset.confirm,
          text: 'Se eliminará ' + (link.dataset.nombre || '') + '. Esta acción no se puede deshacer.',
          icon: 'warning',
          showCancelButton: true,
          confirmButtonColor: '#dc2626',
          cancelButtonColor: '#6b7280',
          confirmButtonText: 'Sí, eliminar',
          cancelButtonText: 'Cancelar'
        }).then(function (r) {
          if (r.isConfirmed) window.location.href = link.href;
        });
      });
    });
  </script>
</body>
</html>
